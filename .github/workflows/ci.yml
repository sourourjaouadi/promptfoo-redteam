name: Enterprise LLM RedTeam CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run code validation & syntax check
        run: node -e "require('./src/api.js'); console.log('API module loaded successfully');"

      - name: Build Docker image
        run: docker build -t promptfoo-redteam:latest .
