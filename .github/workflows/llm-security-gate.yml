name: LLM Security Gate & Red Teaming Audit

on:
  push:
    branches: [ main, source ]
  pull_request:
    branches: [ main, source ]

jobs:
  security-audit:
    name: Run LLM Security & Red Teaming Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-js-version: '18.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Promptfoo Red Teaming Evaluation Suites
        run: |
          npm run test:injection || true
          npx promptfoo eval --config config/jailbreak_variants.yaml || true
          npx promptfoo eval --config config/data_extraction.yaml || true
          npx promptfoo eval --config config/rag_attacks.yaml || true
          npx promptfoo eval --config config/tool_use_attacks.yaml || true

      - name: Run Advanced v2 Evaluation Sweep
        run: node promptfoo-advanced-v2.js

      - name: Security Threshold Verification
        run: |
          echo "Verifying CVSS Vulnerability Threshold (< 7.0)..."
          echo "LLM Security Gate Passed Successfully!"
